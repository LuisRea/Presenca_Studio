  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ["'Cormorant Garamond'", "Georgia", "serif"],
            sans: ["Jost", "system-ui", "sans-serif"]
          },
          colors: {
            marca: "rgb(var(--marca) / <alpha-value>)",
            escuro: "rgb(var(--escuro) / <alpha-value>)",
            claro: "rgb(var(--claro) / <alpha-value>)"
          },
          letterSpacing: { eyebrow: "0.32em" }
        }
      }
    };
    // Hex → canales "r g b" para que funcionen las opacidades de Tailwind (text-escuro/70, etc.)
    for (const [nome, hex] of Object.entries(CLIENTE.cores)) {
      const n = parseInt(hex.replace("#", ""), 16);
      document.documentElement.style.setProperty("--" + nome, [n >> 16, (n >> 8) & 255, n & 255].join(" "));
    }
  </script>

  <!-- =====================================================================
       RENDER — no editar. Vuelca los datos de CLIENTE en los bloques.
       ===================================================================== -->
  <script>
    (function () {
      const C = CLIENTE;
      const get = (ruta) => ruta.split(".").reduce((o, k) => (o == null ? o : o[k]), C);
      const waUrl = "https://wa.me/" + C.whatsapp + "?text=" + encodeURIComponent(C.mensagemWhatsapp);

      // SEO
      document.title = C.seo.titulo;
      document.querySelector('meta[name="description"]').content = C.seo.descricao;

      // Textos simples (se eliminan si el campo está vacío)
      document.querySelectorAll("[data-campo]").forEach((el) => {
        const valor = get(el.dataset.campo);
        if (valor) el.textContent = valor; else el.remove();
      });

      // Listas (beneficios, servicios, testimonios, horarios)
      // data-item="campo" → valor del campo · data-item="#" → número 01, 02… · data-item vacío → el propio elemento
      document.querySelectorAll("[data-lista]").forEach((cont) => {
        const dados = get(cont.dataset.lista);
        const itens = Array.isArray(dados) ? dados : dados.itens;
        const tpl = cont.querySelector("template");
        itens.forEach((item, i) => {
          const nodo = tpl.content.cloneNode(true);
          nodo.querySelectorAll("[data-item]").forEach((el) => {
            const campo = el.dataset.item;
            const valor = campo === "#" ? String(i + 1).padStart(2, "0") : campo ? item[campo] : item;
            if (valor) el.textContent = valor; else el.remove();
          });
          cont.appendChild(nodo);
        });
      });

      // Imágenes
      document.querySelectorAll("[data-img]").forEach((img) => {
        const src = C.imagens[img.dataset.img];
        if (src) { img.src = src; img.alt = C.nome; } else { img.remove(); }
      });

      // WhatsApp
      document.querySelectorAll("[data-whatsapp]").forEach((a) => {
        a.href = waUrl;
        a.target = "_blank";
        a.rel = "noopener";
      });

      // Mapa (embed sin API key)
      const q = encodeURIComponent(C.localizacao.endereco);
      document.querySelector("[data-mapa]").src = "https://www.google.com/maps?q=" + q + "&output=embed";
      document.querySelector("[data-mapa-link]").href = "https://www.google.com/maps/search/?api=1&query=" + q;

      // Instagram
      const ig = document.querySelector("[data-instagram]");
      if (C.instagram) ig.href = "https://instagram.com/" + C.instagram; else ig.remove();

      document.querySelector("[data-ano]").textContent = new Date().getFullYear();

      // Aparición al hacer scroll
      const obs = new IntersectionObserver((entradas) => {
        entradas.forEach((e) => {
          if (e.isIntersecting) { e.target.classList.add("visivel"); obs.unobserve(e.target); }
        });
      }, { threshold: 0.12 });
      document.querySelectorAll(".revelar").forEach((el) => obs.observe(el));

      // SEO local: datos estructurados
      const ld = document.createElement("script");
      ld.type = "application/ld+json";
      ld.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "HealthAndBeautyBusiness",
        name: C.nome,
        description: C.seo.descricao,
        telephone: C.telefone,
        image: C.imagens.hero,
        address: C.localizacao.endereco,
        url: location.href
      });
      document.head.appendChild(ld);
    })();
  </script>
