  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ["'Cormorant Garamond'", "Georgia", "serif"],
            sans: ["Jost", "system-ui", "sans-serif"]
          },
          colors: {
            marca: "rgb(var(--marca) / <alpha-value>)",
            escuro: "rgb(var(--escuro) / <alpha-value>)",
            claro: "rgb(var(--claro) / <alpha-value>)"
          },
          letterSpacing: { eyebrow: "0.32em" }
        }
      }
    };
    // Hex → canales "r g b" para que funcionen las opacidades de Tailwind (text-escuro/70, etc.)
    for (const [nome, hex] of Object.entries(CLIENTE.cores)) {
      const n = parseInt(hex.replace("#", ""), 16);
      document.documentElement.style.setProperty("--" + nome, [n >> 16, (n >> 8) & 255, n & 255].join(" "));
    }
  </script>
  <style>
    /* Aparición suave al hacer scroll (sin librerías) */
    .revelar { opacity: 0; transform: translateY(24px); transition: opacity 1.1s ease, transform 1.1s ease; }
    .revelar.visivel { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .revelar { opacity: 1; transform: none; transition: none; } }

    /* Menú móvil: oculto por defecto; .abierto lo muestra con fundido */
    .menu-movil { opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility .35s; }
    .menu-movil.abierto { opacity: 1; visibility: visible; transition: opacity .35s ease, visibility 0s; } /* visible al instante para poder enfocar la X */
    .menu-movil [data-menu-contenido] { transform: translateY(16px); transition: transform .45s ease; }
    .menu-movil.abierto [data-menu-contenido] { transform: none; }
    @media (prefers-reduced-motion: reduce) {
      .menu-movil, .menu-movil [data-menu-contenido] { transition: none; transform: none; }
    }
  </style>

          <figure class="revelar flex flex-col border-t border-escuro/15 pt-10">
            <span class="font-serif text-6xl leading-none text-marca" aria-hidden="true">“</span>
            <blockquote class="mt-2 flex-1 font-serif text-2xl italic leading-snug" data-item="texto"></blockquote>
            <figcaption class="mt-8 text-xs uppercase tracking-[0.2em]">
              <span data-item="nome"></span>
              <span class="mt-1 block text-escuro/50" data-item="origem"></span>
            </figcaption>
          </figure>
        </template>
      </div>
    </div>
  </section>

  <!-- ===== BLOQUE 5: UBICACIÓN ===== -->
  <section id="localizacao" class="border-t border-escuro/10 py-24 sm:py-32">
    <div class="mx-auto grid max-w-7xl gap-14 px-6 lg:grid-cols-12 lg:items-center lg:px-10">
      <div class="revelar lg:col-span-4">
        <p class="text-xs uppercase tracking-eyebrow text-marca" data-campo="localizacao.sobretitulo"></p>
        <h2 class="mt-6 font-serif text-4xl sm:text-5xl" data-campo="localizacao.titulo"></h2>
        <p class="mt-8 text-lg leading-relaxed" data-campo="localizacao.endereco"></p>
        <p class="mt-4 leading-relaxed text-escuro/60" data-campo="localizacao.nota"></p>
        <h3 class="mt-10 text-xs uppercase tracking-eyebrow text-marca" data-campo="localizacao.rotuloHorarios"></h3>
        <ul class="mt-4 space-y-2 text-escuro/80" data-lista="localizacao.horarios">
          <template><li data-item></li></template>
        </ul>
        <a data-mapa-link target="_blank" rel="noopener noreferrer"
           class="mt-10 inline-block border-b border-escuro/40 pb-1 text-[13px] uppercase tracking-[0.2em] transition hover:border-escuro">
          <span data-campo="localizacao.rotuloMapa"></span> →
        </a>
      </div>
      <div class="revelar isolate overflow-hidden rounded-2xl lg:col-span-7 lg:col-start-6">
        <iframe data-mapa title="Mapa de localização" width="800" height="560" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                class="h-80 w-full border-0 grayscale-[0.6] sepia-[0.15] sm:h-[480px]"></iframe>
      </div>
    </div>
  </section>

  <!-- ===== BLOQUE 6: FOOTER / CTA WHATSAPP ===== -->
  <footer id="contato" data-fondo="cta" class="relative overflow-hidden bg-escuro text-claro">
    <img data-img="cta" alt="" width="2400" height="1600" loading="lazy"
         class="absolute inset-0 h-full w-full object-cover">
    <div class="absolute inset-0 bg-escuro/75"></div>

    <div class="relative mx-auto max-w-3xl px-6 py-32 text-center sm:py-44">
      <h2 class="revelar font-serif text-5xl leading-[1.05] sm:text-7xl" data-campo="cta.titulo"></h2>
      <p class="revelar mx-auto mt-8 max-w-lg text-lg leading-relaxed text-claro/75" data-campo="cta.texto"></p>
      <!-- .revelar en el contenedor para no chocar con la micro-elevación del botón -->
      <div class="revelar mt-12">
        <a data-whatsapp class="group inline-flex items-center gap-4 rounded-full bg-claro px-10 py-5 text-[13px] uppercase tracking-[0.2em] text-escuro shadow-lg shadow-black/15 ring-1 ring-white/25 transition-all duration-300 ease-out hover:-translate-y-0.5 hover:bg-marca hover:text-white hover:shadow-xl">
          <span data-campo="cta.botao"></span>
          <span class="transition group-hover:translate-x-1" aria-hidden="true">→</span>
        </a>
      </div>
    </div>

    <div class="relative border-t border-claro/15">
      <div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-5 px-6 py-[38px] text-[0.76rem] uppercase tracking-[0.12em] text-claro/[0.78] sm:flex-row lg:px-10">
        <p>© <span data-ano></span> <span data-campo="nome"></span></p>
        <div class="flex items-center gap-4">
          <span class="mr-2" data-campo="telefone"></span>
          <a data-rede="instagram" aria-label="Instagram" target="_blank" rel="noopener noreferrer"
             class="rounded-full bg-claro p-3 text-escuro shadow-md ring-2 ring-marca/40 transition-all duration-300 hover:-translate-y-1 hover:scale-110 hover:bg-marca hover:text-white hover:shadow-lg hover:shadow-marca/40">
            <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/>
            </svg>
          </a>
          <a data-rede="facebook" aria-label="Facebook" target="_blank" rel="noopener noreferrer"
             class="rounded-full bg-claro p-3 text-escuro shadow-md ring-2 ring-marca/40 transition-all duration-300 hover:-translate-y-1 hover:scale-110 hover:bg-marca hover:text-white hover:shadow-lg hover:shadow-marca/40">
            <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 3h-2.5A3.5 3.5 0 0 0 9 6.5V10H6.5v3.5H9V21h3.5v-7.5H15l.5-3.5h-3V7a1 1 0 0 1 1-1H15z"/>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Botón flotante de WhatsApp (enlace directo, NO es un chatbot).
       Los halos van como hermanos detrás del botón para que el pulso no tiña el propio botón. -->
  <div data-wa-flotante class="pointer-events-none fixed bottom-[calc(40px+env(safe-area-inset-bottom))] right-5 z-50 translate-y-4 opacity-0 transition-all duration-500 motion-reduce:transition-none sm:right-8 md:bottom-28">
    <span class="pointer-events-none absolute inset-0 animate-ping rounded-full bg-marca/50 [animation-duration:2.4s] motion-reduce:animate-none" aria-hidden="true"></span>
    <span class="pointer-events-none absolute inset-0 animate-ping rounded-full bg-marca/50 [animation-delay:1.2s] [animation-duration:2.4s] motion-reduce:animate-none" aria-hidden="true"></span>
    <a data-whatsapp aria-label="Conversar no WhatsApp"
       class="group relative flex h-14 w-14 items-center justify-center rounded-full bg-escuro text-claro shadow-[0_0_28px_rgb(var(--marca)/0.55)] ring-4 ring-marca/35 transition-all duration-300 ease-out hover:scale-110 hover:bg-marca hover:ring-marca/60 sm:h-16 sm:w-16">
      <svg viewBox="0 0 24 24" class="h-6 w-6 sm:h-7 sm:w-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/>
      </svg>
    </a>
  </div>

  <!-- =====================================================================
       RENDER — no editar. Vuelca los datos de CLIENTE en los bloques.
       ===================================================================== -->
  <script>
    (function () {
      const C = CLIENTE;
      const get = (ruta) => ruta.split(".").reduce((o, k) => (o == null ? o : o[k]), C);
      const wa = (texto) => "https://wa.me/" + String(C.whatsapp).replace(/\D/g, "") + "?text=" + encodeURIComponent(texto);
      const waUrl = wa(C.mensagemWhatsapp);

      // Seguridad: solo se aceptan URLs https:// o rutas relativas limpias (sin esquema, sin "//", sin "..")
      const urlSegura = (u) =>
        typeof u === "string" &&
        (/^https:\/\/[^\s"'<>\\]+$/.test(u) || /^(?!.*\.\.)(\.\/)?[\w-][\w.-]*(\/[\w.-]+)*$/.test(u)) ? u : "";
      // Redes: acepta usuario (con o sin @) o URL https:// completa
      const urlRede = (valor, base) => {
        if (!valor) return "";
        if (/^https:\/\//.test(valor)) return urlSegura(valor);
        const usuario = valor.replace(/^@/, "");
        return /^[\w.-]+$/.test(usuario) ? base + usuario : "";
      };
      const enlaceExterno = (a, href) => {
        a.href = href;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      };

      // SEO
      document.title = C.seo.titulo;
      document.querySelector('meta[name="description"]').content = C.seo.descricao;
      const imagemOg = urlSegura((C.imagens.respaldo && C.imagens.respaldo.hero) || C.imagens.hero);
      document.querySelector('meta[property="og:title"]').content = C.seo.titulo;
      document.querySelector('meta[property="og:description"]').content = C.seo.descricao;
      if (imagemOg) document.querySelector('meta[property="og:image"]').content = imagemOg;

      // Textos simples (se eliminan si el campo está vacío)
      document.querySelectorAll("[data-campo]").forEach((el) => {
        const valor = get(el.dataset.campo);
        if (valor) el.textContent = valor; else el.remove();
      });

      // Listas (beneficios, servicios, testimonios, horarios)
      // data-item="campo" → valor del campo · data-item="#" → número 01, 02… · data-item vacío → el propio elemento
      document.querySelectorAll("[data-lista]").forEach((cont) => {
        const dados = get(cont.dataset.lista);
        const itens = Array.isArray(dados) ? dados : dados.itens;
        const tpl = cont.querySelector("template");
        itens.forEach((item, i) => {
          const nodo = tpl.content.cloneNode(true);
          nodo.querySelectorAll("[data-item]").forEach((el) => {
            const campo = el.dataset.item;
            const valor = campo === "#" ? String(i + 1).padStart(2, "0") : campo ? item[campo] : item;
            if (valor) el.textContent = valor; else el.remove();
          });
          // Aparición en cascada: +100ms por ítem
          const rev = nodo.querySelector(".revelar");
          if (rev) rev.style.transitionDelay = i * 100 + "ms";
          const link = nodo.querySelector("[data-wa-servico]");
          if (link) enlaceExterno(link, wa(C.mensagemServico + " " + item.nome));
          cont.appendChild(nodo);
        });
      });

      // Fondos de respaldo (Unsplash) debajo de la foto local
      document.querySelectorAll("[data-fondo]").forEach((el) => {
        const src = urlSegura((C.imagens.respaldo || {})[el.dataset.fondo]);
        if (!src) return;
        el.style.backgroundImage = 'url("' + src + '")';
        el.style.backgroundSize = "cover";
        el.style.backgroundPosition = "center";
      });

      // Imágenes: si la foto local no existe, se carga la de respaldo en la propia <img>
      // (así el zoom del hover y el lazy loading funcionan igual); si tampoco hay respaldo, se elimina
      document.querySelectorAll("[data-img]").forEach((img) => {
        const src = urlSegura(C.imagens[img.dataset.img]);
        const respaldo = urlSegura((C.imagens.respaldo || {})[img.dataset.img]);
        img.addEventListener("error", () => {
          if (respaldo && !img.dataset.respaldo) { img.dataset.respaldo = "1"; img.src = respaldo; } else { img.remove(); }
        });
        if (src || respaldo) { img.src = src || respaldo; img.alt = C.nome; } else { img.remove(); }
      });

      // Video del Hero (la imagen "hero" queda debajo como fallback y como poster)
      const video = document.querySelector("[data-video-hero]");
      const videoSrc = urlSegura(C.imagens.videoHero);
      const heroSrc = urlSegura(C.imagens.hero);
      const pocoMovimiento = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const ahorroDatos = navigator.connection && navigator.connection.saveData;
      if (videoSrc && !pocoMovimiento && !ahorroDatos) {
        if (heroSrc) video.poster = heroSrc;
        video.addEventListener("error", () => video.remove(), true);
        video.src = videoSrc;
        video.classList.remove("hidden");
      } else {
        video.remove();
      }

      // Header: cristal translúcido al pasar de 60px
      const header = document.querySelector("[data-header]");
      const barra = document.querySelector("[data-header-barra]");
      const actualizarHeader = () => {
        const activo = scrollY > 60;
        // Fondo de cristal en todas las medidas, para que el menú móvil se lea sobre secciones claras
        header.classList.toggle("backdrop-blur-md", activo);
        header.classList.toggle("bg-escuro/85", activo);
        header.classList.toggle("shadow-sm", activo);
        barra.classList.toggle("xl:py-4", activo);
        barra.classList.toggle("xl:py-7", !activo);
      };
      addEventListener("scroll", actualizarHeader, { passive: true });
      actualizarHeader();

      // Esfera de WhatsApp: aparece al salir del Hero
      const esfera = document.querySelector("[data-wa-flotante]");
      new IntersectionObserver(([e]) => {
        ["opacity-0", "translate-y-4", "pointer-events-none"].forEach((c) => esfera.classList.toggle(c, e.isIntersecting));
      }).observe(document.querySelector("#inicio"));

      // Menú móvil
      const panel = document.querySelector("[data-menu-panel]");
      const botaoAbrir = document.querySelector("[data-menu-abrir]");
      const botaoFechar = panel.querySelector("[data-menu-fechar]");
      const alternarMenu = (aberto) => {
        panel.classList.toggle("abierto", aberto);
        botaoAbrir.setAttribute("aria-expanded", String(aberto));
        document.body.style.overflow = aberto ? "hidden" : "";
        (aberto ? botaoFechar : botaoAbrir).focus({ preventScroll: true });
      };
      botaoAbrir.addEventListener("click", () => alternarMenu(true));
      // Cierra al tocar un enlace o fuera del contenido (incluye el botón X, que está fuera)
      panel.addEventListener("click", (e) => {
        if (e.target.closest("a") || !e.target.closest("[data-menu-contenido]")) alternarMenu(false);
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && panel.classList.contains("abierto")) alternarMenu(false);
      });
      // Si la ventana pasa a escritorio con el menú abierto, se cierra y libera el scroll
      matchMedia("(min-width: 1280px)").addEventListener("change", (e) => {
        if (e.matches && panel.classList.contains("abierto")) alternarMenu(false);
      });

      // WhatsApp
      document.querySelectorAll("[data-whatsapp]").forEach((a) => enlaceExterno(a, waUrl));

      // Mapa (embed sin API key)
      const q = encodeURIComponent(C.localizacao.endereco);
      document.querySelector("[data-mapa]").src = "https://www.google.com/maps?q=" + q + "&output=embed";
      document.querySelector("[data-mapa-link]").href = "https://www.google.com/maps/search/?api=1&query=" + q;

      // Redes sociales (se ocultan si están vacías o no son válidas)
      const bases = { instagram: "https://instagram.com/", facebook: "https://facebook.com/" };
      document.querySelectorAll("[data-rede]").forEach((a) => {
        const rede = a.dataset.rede;
        const href = urlRede(C[rede], bases[rede]);
        if (href) enlaceExterno(a, href); else a.remove();
      });

      document.querySelector("[data-ano]").textContent = new Date().getFullYear();

      // Aparición al hacer scroll
      const obs = new IntersectionObserver((entradas) => {
        entradas.forEach((e) => {
          if (e.isIntersecting) { e.target.classList.add("visivel"); obs.unobserve(e.target); }
        });
      }, { threshold: 0.12 });
      document.querySelectorAll(".revelar").forEach((el) => obs.observe(el));

      // SEO local: datos estructurados
      const ld = document.createElement("script");
      ld.type = "application/ld+json";
      ld.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": C.seo.schema || "LocalBusiness",
        name: C.nome,
        description: C.seo.descricao,
        telephone: C.telefone,
        image: heroSrc || undefined,
        address: C.localizacao.endereco,
        url: location.href
      });
      document.head.appendChild(ld);
    })();
  </script>
</body>
</html>
